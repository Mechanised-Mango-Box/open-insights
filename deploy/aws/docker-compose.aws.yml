# Layered over docker-compose.yml on the AWS host by bootstrap.sh:
#
#   docker compose -f docker-compose.yml -f deploy/aws/docker-compose.aws.yml up -d --build
#
# Only what a reproducible, replaceable host needs on top of the shared file.

services:
  caddy:
    # An exact release and digest rather than the floating 2-alpine, so a rebuilt host
    # runs the same proxy.
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    volumes:
      # On the data volume instead of named volumes on the root disk, so certificates
      # survive the instance being replaced. Reissuing them on every rebuild would run
      # into Let's Encrypt's rate limits. Same container paths, so these replace the
      # shared file's entries.
      - /opt/open-insights/persist/caddy/data:/data
      - /opt/open-insights/persist/caddy/config:/config
