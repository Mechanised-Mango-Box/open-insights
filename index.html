<!doctype html>
<!--

Serve this file through a local web server, e.g.

    python -m http.server

Opening it directly via file:// may prevent package loading.

-->
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Dear ImGui Bundle - Pyodide demo</title>
</head>

<body>

    <!--===========================================================================
    Part 1 - Load Pyodide from a CDN
    --------------------------------
    Pyodide: a Python interpreter compiled to WebAssembly,
             so that Python runs directly in the browser.
    Check https://github.com/pyodide/pyodide/releases for more recent versions.
============================================================================-->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>


    <!--===========================================================================
    Part 2 - Python application code (this is what you edit)
    --------------------------------------------------------
    The code is embedded in a <script type="text/python"> tag: browsers
    ignore the unknown type but keep the content as .textContent (read
    from Part 4). No backtick escaping, IDEs can syntax-highlight it.

    Alternative: keep the Python in a separate file (e.g. app.py) and fetch
    it at runtime. See the commented-out snippet in Part 4 below.
============================================================================-->
    <script type="text/python" id="pythonCode">
from imgui_bundle import hello_imgui, imgui
from main import main

if __name__ == "__main__":
    main()
</script>

    <!--===========================================================================
    Part 3 - Page DOM + styles
    --------------------------
    - #canvas: where the ImGui app draws.
    - #loader: an overlay with a CSS spinner (pure CSS, no images),
               shown during initial downloads.
============================================================================-->
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: sans-serif;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #222;
            color: #eee;
        }

        #loader::before {
            content: "";
            width: 48px;
            height: 48px;
            border: 5px solid #444;
            border-top-color: #eee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <div id="loader">Loading Pyodide...</div>
    <canvas id="canvas" tabindex="0"></canvas>


    <!--===========================================================================
    Part 4 - JavaScript driver: loads Pyodide and runs the Python code
============================================================================-->
    <script>
        const loaderEl = document.getElementById("loader");
        const setStatus = m => loaderEl.textContent = m;
        const hideLoader = () => loaderEl.remove();
        const showError = e => { loaderEl.style.background = "#922"; setStatus("Error: " + (e?.message || e)); console.error(e?.message); };

        async function main() {
            // Right-click is scoped to the canvas so normal browser menus still work elsewhere
            const sdl2Canvas = document.getElementById("canvas");
            sdl2Canvas.addEventListener('contextmenu', event => event.preventDefault());

            setStatus("Loading Pyodide...");
            let pyodide = await loadPyodide();

            // 1. Setup SDL, cf https://pyodide.org/en/stable/usage/sdl.html
            pyodide.canvas.setCanvas2D(sdl2Canvas); // Pyodide will use this canvas as the target for SDL/Emscripten rendering.
            pyodide._api._skip_unwind_fatal_error = true;  // required SDL opt-in flag

            // 2. Prepare micropip to load imgui_bundle
            setStatus("Loading micropip...");
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");

            // 3. Install imgui_bundle from PyPI
            //    (imgui_bundle publishes browser-compatible wheels on PyPI, cf PEP 783.
            //     Alternatively, you can host a wheel on your server and install it
            //     via its relative URL.)
            setStatus("Loading imgui_bundle wheel...");
            await micropip.install('imgui-bundle');

            // 4. Load additional required packages used by the demo
            setStatus("Loading numpy...");
            await pyodide.loadPackage('numpy');  // numpy will be loaded from the CDN jsdelivr
            setStatus("Loading opencv...");
            await pyodide.loadPackage('opencv-python');

            setStatus("Loading deps...");
            await micropip.install('typing-extensions');  // numpy will be loaded from the CDN jsdelivr
            setStatus("Loading Python files...");
            const pythonFiles = [
                "utils.py",
                "gui/tab_import_export.py",
                "gui/tab_transcript.py",
                "gui/entity_management.py",
                "gui/model_analysis.py",
                "gui/tab_scenes_stats.py",
                "gui/feature_extraction.py",
                "gui/edit_menu_all.py",
                "export.py",
                "main.py",
                "video_analysis/whisper_functions.py",
                "video_analysis/extracting_metadata.py",
                "video_analysis/open_cv_functions.py",
                "typedef/video.py",
                "typedef/dataset.py",
                "universe.py"
            ];

            try {
                for (let fileName of pythonFiles) {
                    console.log(fileName);

                    // 1. Automatically create parent directories if they exist in the path (e.g., 'gui', 'asset_manager')
                    const lastSlash = fileName.lastIndexOf('/');
                    if (lastSlash !== -1) {
                        const dirPath = fileName.substring(0, lastSlash);
                        pyodide.FS.mkdirTree(dirPath);
                    }

                    // 2. Fetch and write the file into the virtual filesystem tree
                    let response = await fetch(fileName);
                    if (!response.ok) throw new Error(`Failed to fetch ${fileName}`);
                    let code = await response.text();
                    pyodide.FS.writeFile(fileName, code);
                    console.log("OK!");
                }
            } catch (e) {
                throw new Error("Could not load Python files. Make sure you are running a local web server. Details: " + e.message);
            }

            // 5. Run the Python code
            setStatus("Starting app...");
            //    Option a (default): run the Python code embedded in Part 2 above
            pyodide.runPython(document.getElementById("pythonCode").textContent);
            //    Option b: load the Python code from an external file (e.g. app.py next to this HTML):
            // pyodide.runPython(await (await fetch('main.py')).text());
            hideLoader();
        }
        main().catch(showError);
    </script>
    <script>
        async function handle_file_change(event) {
            const files = event.target.files;

            if (!files || files.length === 0) return;

            console.log(`Starting import of ${files.length} files...`);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];

                try {
                    console.log(`Processing: ${file.name}`);
                    const arrayBuffer = await file.arrayBuffer();
                    const uint8Array = new Uint8Array(arrayBuffer);

                    if (window.js_fs_import) {
                        window.js_fs_import(file.name, uint8Array);
                    } else {
                        console.error("Python bridge not found!");
                    }
                } catch (err) {
                    console.error(`Error processing file ${file.name}:`, err);
                }
            }

            console.log("All files have been sent to Python.");
        }

    </script>
    <input type="file" id="file-picker" style="display: none;" onchange="handle_file_change(event)" />


</body>

</html>
